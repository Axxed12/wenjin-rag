# Local Windows management remains native; only the control broker is containerized.
# Exact project is fixed by -p wenjin-manual-mcp; no MCP targets are created here.
services:
  mcp-control-broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: backend
    image: wenjin-mcp-control:2026-10-14
    entrypoint: ["/usr/local/bin/with-secrets"]
    command: ["python", "-m", "wenjin.mcp_control.broker"]
    user: "0:0"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      WENJIN_MCP_CONTROL_PROJECT: wenjin-manual-mcp
      WENJIN_MCP_CONTROL_HOST: 0.0.0.0
      WENJIN_MCP_CONTROL_PORT: "8788"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    ports: ["127.0.0.1:18769:8788"]
    secrets: [mcp_control_token]
    networks: [mcp-control-host]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; t=open('/run/secrets/mcp_control_token').read().strip(); r=urllib.request.Request('http://127.0.0.1:8788/v1/entries',headers={'Authorization':'Bearer '+t}); urllib.request.build_opener(urllib.request.ProxyHandler({})).open(r,timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
secrets:
  mcp_control_token:
    file: ./secrets/manual-agent/mcp_control_token
networks:
  # Host publishing is not routed on an internal-only network on this engine.
  # A dedicated bridge is required; the only published address stays loopback.
  mcp-control-host:
    driver: bridge
