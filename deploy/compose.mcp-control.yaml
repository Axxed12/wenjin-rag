# Optional overlay: adds the narrowly scoped Docker broker used by admin MCP controls.
services:
  management:
    environment:
      WENJIN_MCP_CONTROL_URL: http://mcp-control-broker:8788
      WENJIN_MCP_LEGACY_PUBLIC_URL: ${WENJIN_MCP_LEGACY_PUBLIC_URL:-http://127.0.0.1:18765/mcp}
      WENJIN_MCP_STATELESS_PUBLIC_URL: ${WENJIN_MCP_STATELESS_PUBLIC_URL:-http://127.0.0.1:18768/mcp-stateless}
    secrets:
      - mcp_control_token
    depends_on:
      mcp-control-broker:
        condition: service_started

  mcp-control-broker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: backend
    image: wenjin-backend:2026-10-08
    entrypoint: ["/usr/local/bin/with-secrets"]
    command: ["python", "-m", "wenjin.mcp_control.broker"]
    user: "0:0"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    environment:
      WENJIN_MCP_CONTROL_PROJECT: ${WENJIN_MCP_CONTROL_PROJECT:?Set the exact Compose project used by the MCP containers}
      WENJIN_MCP_CONTROL_HOST: 0.0.0.0
      WENJIN_MCP_CONTROL_PORT: "8788"
    secrets:
      - mcp_control_token
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    expose:
      - "8788"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; token=open('/run/secrets/mcp_control_token',encoding='utf-8').read().strip(); r=urllib.request.Request('http://127.0.0.1:8788/v1/entries',headers={'Authorization':'Bearer '+token}); urllib.request.urlopen(r,timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - data-plane

secrets:
  mcp_control_token:
    file: ${WENJIN_MCP_CONTROL_TOKEN_FILE:?Create an MCP control token file containing at least 32 random characters}
