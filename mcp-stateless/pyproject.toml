[project]
name = "wenjin-rag-mcp-stateless"
version = "0.1.0"
description = "Isolated MCP 2026-07-28 stateless HTTP entry point for Wenjin RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastmcp==4.1.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "llama-index-core>=0.14.24",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "lxml>=6.1.3",
    "mcp==2.3.0",
    "openai>=3.8.0",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.0",
    "uvicorn[standard]>=0.35.0",
]

[tool.uv]
package = false
default-groups = []

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
