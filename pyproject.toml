[project]
name = "wenjin-rag"
version = "0.1.0"
description = "内网研发资料 RAG / MCP 检索服务（本机 MVP）"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastmcp==3.4.4",
    "httpx>=0.28.1",
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "lxml>=6.1.3",
    "openai>=3.8.0",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5,<6",
    "torch==2.11.0",
    "transformers>=4.51,<5",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
